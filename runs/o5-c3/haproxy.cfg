# O5: only loadgen -> HAProxy -> enrolld carries experiment business traffic.
# Existing lbd :8080/:8090 stays available to scaler as a control-plane dependency.
global
    log stdout format raw local0
    nbthread 2
    maxconn 4096
    stats socket /root/lab3/data/o5-haproxy/admin.sock mode 600 level admin
    stats timeout 1s
    spread-checks 0

defaults
    mode http
    log global
    option dontlognull
    log-format "O5REQ backend=%b server=%s status=%ST tr_ms=%Tr ta_ms=%Ta bytes=%B termination=%tsc"
    timeout connect 500ms
    timeout check 500ms
    timeout client 2s
    timeout server 2s
    timeout http-request 2s
    timeout http-keep-alive 2s
    retries 0
    retry-on none

frontend o5_http
    bind 127.0.0.1:18081
    default_backend enrolld_o5

backend enrolld_o5
    balance roundrobin
    http-reuse safe
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    option log-health-checks
    default-server check inter 1s fastinter 1s downinter 1s fall 3 rise 2
    server inst8101 127.0.0.1:8101
    server inst8102 127.0.0.1:8102
    server inst8103 127.0.0.1:8103
